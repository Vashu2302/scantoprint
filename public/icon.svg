<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Glowing Cyan/Indigo Gradient for Document & Pulse -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#6366F1" stroke-width="6" stroke-opacity="0.4" />

  <!-- Top Wireless Beam Waves (Scan / Cloud Signal) -->
  <path d="M196 110 C232 96, 280 96, 316 110" fill="none" stroke="#38BDF8" stroke-width="20" stroke-linecap="round" stroke-opacity="0.9" />
  <path d="M226 142 C242 134, 270 134, 286 142" fill="none" stroke="#818CF8" stroke-width="16" stroke-linecap="round" />

  <!-- Document Coming Out of Printer (Top Paper) -->
  <rect x="176" y="165" width="160" height="110" rx="16" fill="#FFFFFF" filter="url(#glow)" />
  <!-- Document Lines -->
  <rect x="204" y="195" width="70" height="12" rx="6" fill="#6366F1" />
  <rect x="204" y="218" width="104" height="10" rx="5" fill="#CBD5E1" />
  <rect x="204" y="238" width="88" height="10" rx="5" fill="#CBD5E1" />

  <!-- Printer Main Body -->
  <rect x="116" y="250" width="280" height="135" rx="32" fill="#0F172A" stroke="#475569" stroke-width="8" />

  <!-- Printer Front Slot (Output Spool) -->
  <rect x="160" y="315" width="192" height="40" rx="14" fill="#030712" stroke="#334155" stroke-width="4" />

  <!-- Fresh Printed Sheet Emerging from Bottom Slot -->
  <rect x="180" y="335" width="152" height="65" rx="12" fill="url(#accentGrad)" opacity="0.95" />

  <!-- Front LED Status Light (Green Active Pulse) -->
  <circle cx="355" cy="285" r="10" fill="#10B981" />
  <circle cx="355" cy="285" r="18" fill="#10B981" opacity="0.35" />
</svg>